<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورشة بناء أسئلة الاختبار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Noto+Naskh+Arabic:wght@400;700&family=Aref+Ruqaa:wght@700&family=Aref+Ruqaa+Ink:wght@400;700&display=swap">
<style>
:root{
  --bg:#EDF1EE; --dot:#D3DCD6; --surface:#FBFAF6; --ink:#1F3440; --soft:#566871; --line:#DCE2DD;
  --paper:#FFFCF5; --paper-ink:#1E2B33; --faded:#BCBDB7; --rule:#EADFC9;
  --pen:#3E6F86; --pen-deep:#24485A; --pen-soft:#E3EDF2; --sage:#6F8F7F; --sage-soft:#E6EEE9;
  --ok:#3F6E5A; --ok-soft:#E3EEE7; --bad:#A0563F; --bad-soft:#F6E7E0;
  --gold:#B8955A; --gold-deep:#8C6B33; --gold-soft:#F5EEDF;
  --shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 22px 50px -18px rgba(31,52,64,.28);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;line-height:1.65;padding-bottom:env(safe-area-inset-bottom,0px);background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px, transparent 1.2px);background-size:22px 22px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:780px;margin:0 auto;padding:28px 16px 320px}
.wide{max-width:1180px}
h1,h2,h3{font-family:'Tajawal',Tahoma,sans-serif;margin:0;font-weight:700}
.muted{color:var(--soft)}
.btn{min-height:52px;padding:0 26px;border:none;border-radius:999px;background:var(--pen-deep);color:#FFFCF5;font-weight:600;font-size:1.05rem;cursor:pointer;box-shadow:0 10px 22px -10px rgba(36,72,90,.6);transition:transform .15s ease}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.gold{background:var(--gold-deep);box-shadow:0 10px 22px -10px rgba(140,107,51,.7)}
.field{width:100%;min-height:56px;border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:0 18px;font-size:1.1rem}
.field:focus{border-color:var(--gold)}
.err{color:var(--bad);font-weight:600;min-height:1.6em;margin:0}
.link{background:none;border:none;color:var(--soft);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px;cursor:pointer;padding:8px}
.hero{position:relative;background:var(--surface);border-radius:28px;padding:34px 28px 30px;margin-top:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);border:1px solid #fff}
.hero::before{content:"";position:absolute;inset:10px;border:1px solid var(--rule);border-radius:20px;pointer-events:none}
.hero > *{position:relative}
.hero h1{font-size:2.1rem;line-height:1.3;text-align:center}
.hero .sub{margin:0;text-align:center;color:var(--soft)}
.illus{display:flex;justify-content:center}
.illus svg{max-width:100%;height:auto}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold)}
.orn::before,.orn::after{content:"";height:1px;width:70px;background:linear-gradient(to left,transparent,var(--gold))}
.orn::after{background:linear-gradient(to right,transparent,var(--gold))}
.pill{display:inline-flex;align-self:center;gap:8px;align-items:center;justify-content:center;text-align:center;font-size:.9rem;font-weight:600;color:var(--gold-deep);background:var(--gold-soft);padding:4px 14px;border-radius:999px}
.top{position:sticky;top:0;z-index:5;background:rgba(251,250,246,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:780px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.top-in h2{font-size:1.15rem;flex:1;display:flex;align-items:center;gap:10px}
.bar{height:5px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(to left,var(--gold),var(--pen));transition:width .4s ease}
.desk{position:relative;margin-top:30px}
.desk .pencil{position:absolute;left:-6px;top:-34px;width:150px;transform:rotate(-14deg);z-index:2;pointer-events:none}
.paper{position:relative;background-color:var(--paper);color:var(--paper-ink);border-radius:4px 4px 10px 10px;box-shadow:var(--shadow);padding:30px 26px 34px 22px;font-family:'Noto Naskh Arabic',Tahoma,serif;font-size:1.05rem;background-image:repeating-linear-gradient(to bottom,transparent 0 33px,rgba(62,111,134,.07) 33px 34px)}
.paper::before{content:"";position:absolute;inset:0 18px 0 auto;width:1.5px;background:rgba(160,86,63,.28)}
.paper .clip{position:absolute;top:-22px;right:46px;width:30px}
.paper .phead{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px;padding:0 0 10px;border-bottom:1px solid var(--rule);font-family:'Tajawal',Tahoma,sans-serif;color:var(--soft);font-size:.9rem}
.block{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px dashed var(--rule)}
.block:last-child{border-bottom:none}
.block .txt{flex:1;min-width:0}
.block p{margin:0}
.opts{color:#3F4C53;font-size:.98rem;margin-top:4px}
.faded{color:var(--faded);font-size:.72rem;line-height:1.3}
.mark{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:2px dashed var(--gold);background:var(--gold-soft);color:var(--gold-deep);font-family:'Tajawal',Tahoma,sans-serif;font-weight:700;font-size:1.1rem;cursor:pointer;transition:transform .15s ease}
.mark:hover{transform:rotate(-8deg) scale(1.06)}
.mark.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.mark.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;margin-top:6px;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;font-size:.85rem;font-weight:600;padding:2px 12px;border-radius:999px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:3px solid var(--gold);box-shadow:0 -18px 44px rgba(31,52,64,.2);border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet-in{max-width:780px;margin:0 auto}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.choice{min-height:54px;border:1.5px solid var(--line);background:#fff;border-radius:16px;font-weight:600;cursor:pointer;padding:8px;transition:border-color .15s ease}
.choice:hover:not(:disabled){border-color:var(--gold)}
.choice:disabled{cursor:default;opacity:.5}
.choice.right{opacity:1;border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.choice.wrong{opacity:1;border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fb{margin-top:14px;padding:12px 16px;border-radius:16px;background:var(--sage-soft);border-right:4px solid var(--sage)}
.fb strong{display:block;font-family:'Tajawal',Tahoma,sans-serif}
.row{display:flex;gap:10px;margin-top:14px}
.row .btn{flex:1}
.cert{position:relative;background-color:#FFFCF5;color:#1E2B33;border-radius:6px;box-shadow:var(--shadow);padding:16px;margin-top:22px;background-image:radial-gradient(circle at 50% 0%,rgba(184,149,90,.12),transparent 60%)}
.cert-in{position:relative;border:2px solid #B8955A;outline:1px solid #D9C7A0;outline-offset:-9px;border-radius:2px;padding:46px 26px 34px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.cert .corner{position:absolute;width:54px;height:54px}
.cert .c1{top:6px;right:6px}.cert .c2{top:6px;left:6px;transform:scaleX(-1)}.cert .c3{bottom:6px;right:6px;transform:scaleY(-1)}.cert .c4{bottom:6px;left:6px;transform:scale(-1,-1)}
.cert .seal{width:104px;height:104px}
.cert .kind{font-family:'Aref Ruqaa',Tahoma,serif;font-size:2.8rem;color:#8C6B33;line-height:1.2}
.cert .to{font-size:1.05rem;color:#566871}
.cert .name{font-family:'Tajawal',Tahoma,sans-serif;font-size:2.1rem;font-weight:700;color:#1F3440;padding:0 26px 8px;border-bottom:1px solid #D9C7A0}
.cert .for{max-width:520px;font-size:1.05rem}
.cert .score{font-family:'Tajawal',Tahoma,sans-serif;font-size:1.2rem;color:#24485A;background:#F5EEDF;padding:4px 18px;border-radius:999px}
.cert .foot{display:flex;justify-content:space-between;align-items:flex-start;width:100%;max-width:540px;margin-top:20px;font-size:.95rem;color:#566871}
.cert .foot div{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:140px}
.cert .foot div span{font-size:.85rem;color:#566871}
.cert-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 22px}
.dhead h1{font-size:1.8rem;flex:1;display:flex;align-items:center;gap:12px}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--ok);font-weight:600;background:var(--ok-soft);padding:4px 14px;border-radius:999px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:22px}
.stat{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:22px;padding:18px 20px;box-shadow:var(--shadow);border:1px solid #fff}
.stat svg{flex:none;width:52px;height:52px}
.stat b{display:block;font-family:'Tajawal',Tahoma,sans-serif;font-size:2.3rem;line-height:1.1;color:var(--pen-deep)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.card{background:var(--surface);border-radius:24px;padding:22px;box-shadow:var(--shadow);border:1px solid #fff}
.card h3{font-size:1.2rem;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.card h3::before{content:"";width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--gold)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;min-height:200px;margin-bottom:6px}
.step{width:150px;text-align:center}
.step .who{font-family:'Tajawal',Tahoma,sans-serif;font-weight:700;margin-bottom:6px;overflow-wrap:anywhere}
.step .blk{border-radius:16px 16px 4px 4px;display:grid;place-items:center;font-family:'Tajawal',Tahoma,sans-serif;font-weight:700;padding:8px}
.p1 .blk{height:146px;background:linear-gradient(to bottom,#F5EEDF,#EADBB9);color:var(--gold-deep);border:1.5px solid var(--gold)}
.p2 .blk{height:108px;background:var(--pen-soft);color:var(--pen-deep)}
.p3 .blk{height:78px;background:var(--sage-soft);color:var(--ok)}
.tlist{display:flex;flex-direction:column;gap:8px}
.rw{display:flex;gap:6px;align-items:center}.rw .trow{flex:1;min-width:0}
.del{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--bad);cursor:pointer;display:grid;place-items:center}.del:hover{border-color:var(--bad);background:var(--bad-soft)}
.del.armed{width:auto;padding:0 12px;background:var(--bad);color:#fff;border-color:var(--bad);font-weight:600;font-size:.85rem;white-space:nowrap}
.trow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);width:100%;text-align:right;cursor:pointer}
.trow:hover{border-color:var(--gold)}
.trow .nm{width:34%;font-weight:600;overflow-wrap:anywhere}
.trow .track{flex:1;height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.trow .track i{display:block;height:100%;background:var(--pen);border-radius:999px;transition:width .5s ease}
.trow.star .track i{background:linear-gradient(to left,#D8BD84,var(--gold-deep))}
.trow .pc{width:66px;text-align:left;font-weight:600}
.trow .st{font-size:.8rem;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--pen-soft);color:var(--pen-deep);white-space:nowrap}
.trow.star .st{background:var(--gold-soft);color:var(--gold-deep)}
.spot{margin-bottom:16px}
.spot .sh{display:flex;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:6px;flex-wrap:wrap}
.dist{display:flex;height:30px;border-radius:999px;overflow:hidden;background:var(--line)}
.dist span{display:grid;place-items:center;font-size:.8rem;font-weight:600;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.puzzle{background:var(--bad-soft);border-radius:18px;padding:14px 16px}
.puzzle b{display:block;font-family:'Tajawal',Tahoma,sans-serif;font-size:1.6rem;color:var(--bad)}
.empty{color:var(--soft);text-align:center;padding:24px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
@media (max-width:520px){.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.desk .pencil{width:110px;top:-28px}.hero h1{font-size:1.7rem}}
@media print{body{background:#fff}body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;inset:0;box-shadow:none;margin:0}.cert-actions{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.btns{display:flex;flex-direction:column;gap:10px}
.okmark{align-self:center;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);border:2px solid var(--ok)}
.attcard{margin-bottom:20px}
.attn{font-size:.95rem;background:var(--gold-soft);color:var(--gold-deep);padding:1px 12px;border-radius:999px}
.attlist{margin:0;padding:0 22px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 24px}
.attlist li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.attlist small{color:var(--soft);white-space:nowrap}
.by{margin:-6px 0 0;text-align:center;color:var(--soft);font-size:1rem}
.by b{font-family:'Tajawal',Tahoma,sans-serif;color:var(--gold-deep);font-size:1.15rem}
.note{font-size:.9rem;color:var(--soft);margin:-6px 0 0}
.phase{font-size:.8rem;font-weight:600;padding:2px 12px;border-radius:999px;background:var(--pen-soft);color:var(--pen-deep)}
.phase.post{background:var(--gold-soft);color:var(--gold-deep)}
.mark.picked{border-style:solid;border-color:var(--pen);background:var(--pen-soft);color:var(--pen-deep)}
.tag.pick{background:var(--pen-soft);color:var(--pen-deep)}
.choice.chosen{border-color:var(--pen);background:var(--pen-soft);color:var(--pen-deep)}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.impact{margin-bottom:20px}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-family:'Tajawal',Tahoma,sans-serif;font-size:1.2rem;margin-bottom:14px}
.big b{font-size:2.8rem;color:#7B9CAE;line-height:1}
.big b.gold{color:var(--gold-deep)}
.gain{background:var(--ok-soft);color:var(--ok);padding:2px 14px;border-radius:999px;font-weight:700;font-size:1rem}
.keys{display:flex;gap:16px;font-size:.85rem;margin-bottom:10px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:22px;height:8px;border-radius:999px;display:inline-block}
.kpre{background:#9FBCCB}.kpost{background:var(--gold-deep)}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px}
.crow{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center}
.crow .cn{font-weight:600}
.crow .b2{display:flex;flex-direction:column;gap:5px}
.t{height:9px;border-radius:999px;background:var(--line);overflow:hidden}
.t i{display:block;height:100%;border-radius:999px;transition:width .6s ease}
.t.pre i{background:#9FBCCB}.t.post i{background:var(--gold-deep)}
.cv{font-size:.8rem;line-height:1.35;text-align:left;color:var(--soft)}
.cv b{color:var(--gold-deep);font-size:.9rem}
.best{display:flex;align-items:center;gap:14px;margin-top:18px;background:var(--gold-soft);border-radius:18px;padding:12px 16px}
.best .seal{width:64px;height:64px;flex:none}
.best div{display:flex;flex-direction:column}
.best small{color:var(--gold-deep);font-weight:600}
.best b{font-family:'Tajawal',Tahoma,sans-serif;font-size:1.4rem}
.trow:disabled{cursor:default;opacity:1}
.trow .pp{font-family:'Tajawal',Tahoma,sans-serif;font-weight:700;flex:1;text-align:center;white-space:nowrap}
.trow .chg{font-weight:700;font-size:.85rem;padding:1px 9px;border-radius:999px;background:var(--line);color:var(--soft)}
.trow .chg.up{background:var(--ok-soft);color:var(--ok)}
.tabs{display:inline-flex;background:var(--bg);border-radius:999px;padding:4px;gap:4px;margin-bottom:12px}
.tabs button{border:none;background:transparent;border-radius:999px;padding:0 18px;min-height:40px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--surface);box-shadow:0 4px 12px -6px rgba(31,52,64,.4)}
.cert .school{font-family:'Tajawal',Tahoma,sans-serif;color:#566871;font-size:1rem;font-weight:600}
.cert .foot{max-width:620px}
.cert .foot div{min-width:150px}
.cert .sig{font-family:'Aref Ruqaa Ink','Aref Ruqaa',Tahoma,serif;font-size:1.75rem;color:#24485A;line-height:1.15;margin:0 0 2px}
.cert .sig-img{height:62px;max-width:200px;object-fit:contain;margin-bottom:2px}
.cert .pname{font-family:'Tajawal',Tahoma,sans-serif;font-size:1.2rem;font-weight:700;color:#1F3440;margin:0 0 4px}
.cert .foot em{font-style:normal;font-size:1.05rem;font-weight:700;color:#1F3440;font-family:'Tajawal',Tahoma,sans-serif;margin-bottom:4px}
@media (max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cmp{grid-template-columns:1fr}}
@media (max-width:520px){.cert .foot{flex-direction:column;align-items:center;gap:16px}.crow{grid-template-columns:90px 1fr 50px}}
</style>

</head>
<body>
<div id="app"></div>

<script>
/* ================= الإعدادات ================= */
const CFG = {
  scriptUrl: "https://script.google.com/macros/s/AKfycby0YfvDurz92_Nc6wF2qK_FSW4a7UVIO-ftJbdUQiQQYeYBRxmMvlVEKUlE4N7s3O0LWA/exec",                          /* ← رابط تطبيق الويب من Google Apps Script */
  presenter: "لطفيه الطلحي",              /* منفذة الورشة */
  principal: "اسماء العتيبي",              /* مديرة المدرسة */
  school: "متوسطة السيل الصغير",
  presenterSign: "",                      /* توقيعك مضمّن في آخر الملف؛ اتركيها فارغة */
    starAt: 5                               /* عدد الإجابات الصحيحة لشهادة التميّز */
};
const TRIP = "ورشة الاختبار الجيد";
/* ============================================ */

const OPTIONS = ['الصدق','الثبات','الموضوعية','التمييز','الشمول','الإخراج والوضوح'];
const COLORS  = ['#3E6F86','#6F8F7F','#A8854A','#A0563F','#7A6E9A','#5E6E76'];
const SPOTS = [
  {name:'الفقرة ١', html:'<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><p style="font-family:\'Tajawal\',Tahoma,sans-serif;font-size:1.4rem;font-weight:700">اختبار العلوم</p><p>الاسم: ............</p></div>', answer:5, why:'العنوان ناقص: لا صف ولا زمن ولا درجات ولا تعليمات.'},

  {name:'الفقرة ٣', html:'<p>أيٌّ مما يلي ليس من الأجزاء غير الضرورية للنبات؟</p><p class="opts">(أ) الجذر (ب) الساق (ج) الورقة (د) جميع ما سبق</p>', answer:0, why:'النفي المزدوج يقيس مهارة القراءة لا معرفة العلوم.'},

const AR='٠١٢٣٤٥٦٧٨٩';

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LSK='good-test-workshop-v3';

          set(k,val){try{const v=JSON.parse(localStorage.getItem(LSK)||'{}');v[k]=val;localStorage.setItem(LSK,JSON.stringify(v));}catch(e){}}};
const remote=()=>/^https:\/\/script\.google(usercontent)?\.com\//.test(CFG.scriptUrl);
const today=()=>{try{return new Date().toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'});}catch(e){return new Date().toISOString().slice(0,10);}};
const norm=n=>String(n||'').trim().replace(/\s+/g,' ').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
const isDone=a=>Array.isArray(a)&&a.length===N&&a.every(p=>p!==null&&p!==undefined);
const score=p=>(p||[]).filter((v,i)=>v===SPOTS[i].answer).length;
const pct=(x)=>ar(Math.round(x))+'٪';
const signed=d=>(d>0?'+':d<0?'−':'')+ar(Math.abs(d));

function post(body){
  if(!remote())return;
  try{fetch(CFG.scriptUrl,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({trip:TRIP},body))}).catch(()=>{});}catch(e){}
}
async function pullAll(code){
  const r=await fetch(CFG.scriptUrl+'?action=all&trip='+encodeURIComponent(TRIP)+'&code='+encodeURIComponent(code)+'&t='+Date.now());
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'read');
  return j.records||[];
}
function localSave(rec){const all=LS.get('local',{});all[rec.id]=rec;LS.set('local',all);}

function clearHash(){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){try{location.hash='';}catch(_){}}}
function visible(all){
  let resetAt=LS.get('resetAt','');
  const hidden=new Set(LS.get('hidden',[]));
  all.forEach(x=>{if(x&&x.type==='reset'&&x.date>resetAt)resetAt=x.date;if(x&&x.type==='deleted')hidden.add(x.id);});
  const byId={};
  all.forEach(x=>{if(!x||x.type!=='res'||!x.name)return;if(hidden.has(x.id))return;if(resetAt&&!(x.date>resetAt))return;if(!byId[x.id]||x.date>byId[x.id].date)byId[x.id]=x;});
  return Object.values(byId).map(r=>Object.assign({},r,{phase:r.phase==='pre'?'pre':'post',picks:Array.from({length:N},(_,i)=>{const v=(r.picks||[])[i];return v===undefined?null:v;})}));
}

function markAttend(n){
  const key='att_done_'+norm(n);
  if(LS.get(key,false))return;
  const now=new Date();
  const rec={id:'att_'+now.getTime().toString(36)+Math.random().toString(36).slice(2,7),type:'att',name:n,date:now.toISOString()};

function start(ph){
  const n=$('nm').value.trim().replace(/\s+/g,' ');
  if(n.split(' ').length<2){$('err').textContent='اكتبي اسمك الثلاثي أو الثنائي على الأقل.';return;}
  if(norm(n)!==norm(S.name)){['pre','post'].forEach(p=>{S.ids[p]='';S.picks[p]=Array(N).fill(null);LS.set('id_'+p,'');LS.set('picks_'+p,S.picks[p]);});}
  S.name=n;LS.set('name',n);markAttend(n);
  if(!S.ids[ph]){S.ids[ph]='res_'+ph+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);LS.set('id_'+ph,S.ids[ph]);S.picks[ph]=Array(N).fill(null);LS.set('picks_'+ph,S.picks[ph]);}
  S.phase=ph;
  if(ph==='post'&&isDone(P())){S.certRec=record(true);S.certPre=localPre();S.from='quiz';S.view='cert';}
  else if(ph==='pre'&&isDone(P())){S.view='thanks';}
  else{S.view='quiz';sync(false);}
  render();window.scrollTo(0,0);
}

function openSpot(i){
  S.cur=i;const s=SPOTS[i],v=P()[i],pre=S.phase==='pre';
  $('st').textContent=s.name;
  $('ch').innerHTML=OPTIONS.map((o,k)=>{
    let c='';if(v!==null){c=pre?(k===v?'chosen':''):(k===s.answer?'right':(k===v?'wrong':''));}
    return `<button type="button" class="choice ${c}" data-k="${k}" ${(!pre&&v!==null)?'disabled':''}>${o}</button>`;}).join('');
  $('fb').innerHTML=(!pre&&v!==null)?`<div class="fb"><strong>${v===s.answer?'إجابة صحيحة':'الإجابة: '+OPTIONS[s.answer]}</strong>${s.why}</div>`:'';
  $('nx').hidden=!(v!==null&&nextOpen(i)>=0);
  document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>pick(+c.dataset.k));
  $('sheet').classList.add('open');
}
function pick(k){
  const i=S.cur,p=P(),pre=S.phase==='pre';
  if(!pre&&p[i]!==null)return;
  p[i]=k;
  if(pre){sync(false);quiz();const j=nextOpen(i);openSpot(i);if(j>=0)setTimeout(()=>{if($('sheet'))openSpot(j);},450);}
  else{sync(isDone(p));quiz();openSpot(i);}
}

function login(){
  app.innerHTML=`<div class="wrap"><div class="hero">
    <span class="pill">${penIcon('#8C6B33')} للمنفذة فقط</span>
    <h1>لوحة منفذة الورشة</h1>

    <label for="cd" style="font-weight:600">الرمز</label>
    <input id="cd" class="field" type="password" inputmode="numeric" autocomplete="off">
    <p class="err">${esc(S.err)}</p>
    <button class="btn" id="in" type="button">دخول</button>
  </div><p style="text-align:center;margin-top:18px"><button class="link" id="hm" type="button">صفحة المعلمات</button></p></div>`;

    $('in').disabled=true;$('in').textContent='جاري التحميل…';
    try{const A=await pullAll(c);S.att=attendees(A);S.records=visible(A);S.code=c;S.err='';S.view='dash';render();}
    catch(e){S.err=String(e.message)==='code'?'الرمز لا يطابق الرمز المكتوب في Google Apps Script.':'تعذّر الاتصال بـ Google Sheets. تأكدي من الإنترنت ومن رابط Apps Script.';render();}
  };
  $('cd').onkeydown=e=>{if(e.key==='Enter')$('in').click();};
  $('hm').onclick=()=>{clearHash();S.view='home';render();};
}
function people(){
  const map={};
  S.records.forEach(r=>{const k=norm(r.name);const p=map[k]||(map[k]={key:k,name:r.name,pre:null,post:null});
    if(!p[r.phase]||r.date>p[r.phase].date)p[r.phase]=r;if(r.phase==='post')p.name=r.name;});
  return Object.values(map).map(p=>Object.assign(p,{
    preDone:!!p.pre&&isDone(p.pre.picks),postDone:!!p.post&&isDone(p.post.picks),
    preSc:p.pre?score(p.pre.picks):null,postSc:p.post?score(p.post.picks):null}));
}
function charRate(list,ph){
  return OPTIONS.map((o,c)=>{let ok=0,tot=0;list.forEach(p=>{const r=p[ph];SPOTS.forEach((s,i)=>{if(s.answer===c){tot++;if(r.picks[i]===c)ok++;}});});return tot?ok/tot*100:null;});
}
function dash(){
  const ps=people();
  const preD=ps.filter(p=>p.preDone),postD=ps.filter(p=>p.postDone);
  const nowA=S.records.filter(r=>!isDone(r.picks)).length;
  const avg=(arr,k)=>arr.length?arr.reduce((a,p)=>a+p[k],0)/arr.length/N*100:null;
  const aPre=avg(preD,'preSc'),aPost=avg(postD,'postSc');
  const rPre=charRate(preD,'pre'),rPost=charRate(postD,'post');
  const both=ps.filter(p=>p.preDone&&p.postDone);
  let best=null;both.forEach(p=>{const g=p.postSc-p.preSc;if(!best||g>best.g)best={name:p.name,g};});
  const ranked=postD.slice().sort((a,b)=>b.postSc-a.postSc);
  const pod=[1,0,2].map(r=>ranked[r]?`<div class="step p${r+1}"><div class="who">${esc(ranked[r].name)}</div><div class="blk">${ar(ranked[r].postSc)} / ${ar(N)}</div></div>`:'').join('');
  const rows=ps.slice().sort((a,b)=>(b.postSc??-1)-(a.postSc??-1)||(b.preSc??-1)-(a.preSc??-1));
  const ph=S.dphase,phList=S.records.filter(r=>r.phase===ph);
  const counts=SPOTS.map((s,i)=>{const c=Array(6).fill(0);phList.forEach(r=>{const v=r.picks[i];if(v!==null&&c[v]!==undefined)c[v]++;});return c;});
  let worst=-1,wp=2;counts.forEach((c,i)=>{const t=c.reduce((a,b)=>a+b,0);if(t){const q=c[SPOTS[i].answer]/t;if(q<wp){wp=q;worst=i;}}});

  app.innerHTML=`<div class="wrap wide">
  <div class="dhead"><h1>${penIcon()}لوحة منفذة الورشة</h1><span class="live"><i></i>تتحدث تلقائيًا</span><button class="btn ghost" id="out" type="button">خروج</button></div>
  <div class="stats">
    <div class="stat">${statIcon('now')}<div><b>${ar(preD.length)}</b>أنهت التشخيص الأول</div></div>
    <div class="stat">${statIcon('done')}<div><b>${ar(postD.length)}</b>أنهت التشخيص الثاني</div></div>
    <div class="stat">${statIcon('acc')}<div><b>${aPre===null?'—':pct(aPre)}</b>دقة التشخيص الأول</div></div>
    <div class="stat">${statIcon('acc')}<div><b>${aPost===null?'—':pct(aPost)}</b>دقة التشخيص الثاني</div></div>
  </div>
  ${nowA?`<p class="muted" style="margin:-8px 4px 18px">${ar(nowA)} تجيب الآن…</p>`:''}

  <div class="card attcard">
    <h3>الحضور <span class="attn">${ar((S.att||[]).length)}</span></h3>
    ${(S.att||[]).length?`<ol class="attlist">${S.att.map(a=>`<li><span>${esc(a.name)}</span><small>${timeOf(a.date)}</small></li>`).join('')}</ol>`:'<p class="muted" style="margin:0">لم تسجّل أي معلمة حضورها بعد. رابط التسجيل هو رابط الورشة نفسه مع ‎#attend في آخره.</p>'}
  </div>

  <div class="card impact">
    <h3>قياس الأثر</h3>
    ${aPre!==null&&aPost!==null?`<div class="big"><span>من</span><b>${pct(aPre)}</b><span>إلى</span><b class="gold">${pct(aPost)}</b><span class="gain">${signed(Math.round(aPost)-Math.round(aPre))} نقطة</span></div>`:'<p class="muted">يظهر هنا الفرق بين التشخيصين عند وصول الإجابات.</p>'}
    <div class="keys"><span><i class="kpre"></i>التشخيص الأول</span><span><i class="kpost"></i>التشخيص الثاني</span></div>
    <div class="cmp">${OPTIONS.map((o,c)=>`<div class="crow"><span class="cn">${o}</span><div class="b2"><div class="t pre"><i style="width:${rPre[c]??0}%"></i></div><div class="t post"><i style="width:${rPost[c]??0}%"></i></div></div><span class="cv">${rPre[c]===null?'—':pct(rPre[c])}<br><b>${rPost[c]===null?'—':pct(rPost[c])}</b></span></div>`).join('')}</div>
    ${best&&best.g>0?`<div class="best">${sealArt()}<div><small>الأكثر تقدّمًا</small><b>${esc(best.name)}</b><span>${signed(best.g)} مواضع في التشخيص الثاني</span></div></div>`:''}
  </div>

  <div class="grid2">
    <div class="card"><h3>منصة التتويج (التشخيص الثاني)</h3>${ranked.length?`<div class="podium">${pod}</div>`:'<p class="empty">بانتظار أول معلمة تنهي التشخيص الثاني…</p>'}
      <h3 style="margin-top:18px">كل المشاركات</h3>
      <div class="tlist">${rows.length?rows.map(p=>{
        const g=(p.preDone&&p.postDone)?p.postSc-p.preSc:null, star=p.postDone&&p.postSc>=CFG.starAt;
        const st=p.postDone?(star?'تميّز':'أنهت'):(p.post?'في التشخيص الثاني':(p.preDone?'أنهت الأول':'في التشخيص الأول'));
        return `<div class="rw"><button type="button" class="trow ${star?'star':''}" data-k="${esc(p.key)}" ${p.postDone?'':'disabled'}>
          <span class="nm">${esc(p.name)}</span>
          <span class="pp">${p.preDone?ar(p.preSc):'—'} ← ${p.postDone?ar(p.postSc):'—'}</span>
          ${g!==null?`<span class="chg ${g>0?'up':''}">${signed(g)}</span>`:''}
          <span class="st">${st}</span></button>
          ${S.armDel===p.key?`<button type="button" class="del armed" data-k="${esc(p.key)}">تأكيد الحذف</button>`:`<button type="button" class="del" data-k="${esc(p.key)}" aria-label="حذف نتيجة ${esc(p.name)}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`}</div>`;}).join(''):'<p class="empty">لا مشاركات بعد. أرسلي الرابط للمعلمات.</p>'}</div>
      <p class="muted" style="font-size:.9rem;margin:10px 0 0">الأرقام: التشخيص الأول ← الثاني. اضغطي على اسم أنهت التشخيص الثاني لعرض شهادتها.</p>
    </div>
    <div class="card"><h3>ماذا اختارت المعلمات في كل موضع؟</h3>
      <div class="tabs"><button type="button" data-ph="pre" class="${ph==='pre'?'on':''}">التشخيص الأول</button><button type="button" data-ph="post" class="${ph==='post'?'on':''}">التشخيص الثاني</button></div>
      <div class="legend">${OPTIONS.map((o,k)=>`<span><i style="background:${COLORS[k]}"></i>${o}</span>`).join('')}</div>
      ${SPOTS.map((s,i)=>{const c=counts[i],t=c.reduce((a,b)=>a+b,0);
        return `<div class="spot"><div class="sh"><span>${s.name}</span><span class="muted">الصحيح: ${OPTIONS[s.answer]}${t?' · '+pct(c[s.answer]/t*100):''}</span></div>
        <div class="dist">${t?c.map((n,k)=>n?`<span style="width:${n/t*100}%;background:${COLORS[k]}" title="${OPTIONS[k]}: ${n}">${ar(n)}</span>`:'').join(''):''}</div></div>`;}).join('')}
      <div class="${worst<0?'':'puzzle'}" style="margin-top:8px">${worst<0?'<p class="muted">ستظهر هنا أصعب نقطة بعد وصول الإجابات.</p>':`<h3>الموضع الذي حيّر الجميع</h3><b>${SPOTS[worst].name}</b><p style="margin:4px 0 0">أصابت فيه ${pct(wp*100)} فقط. الإجابة: ${OPTIONS[SPOTS[worst].answer]}. ${SPOTS[worst].why}</p>`}</div>
    </div>
  </div>
  <p style="text-align:center;margin-top:22px"><button class="${S.armClr?'btn':'link'}" id="clr" type="button" ${S.armClr?'style="background:var(--bad)"':''}>${S.armClr?'اضغطي مرة ثانية لتأكيد المسح':'مسح نتائج الورشة والبدء من جديد'}</button></p>
  </div>`;

  document.querySelectorAll('.trow').forEach(b=>b.onclick=()=>{const p=people().find(x=>x.key===b.dataset.k);if(!p||!p.postDone)return;
    S.certRec=p.post;S.certPre=p.preDone?p.preSc:null;S.from='dash';S.view='cert';render();window.scrollTo(0,0);});
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.dphase=b.dataset.ph;dash();});
  $('out').onclick=()=>{S.code='';clearHash();S.view='home';render();};
  document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    const p=people().find(x=>x.key===b.dataset.k);if(!p)return;
    if(S.armDel!==p.key){S.armDel=p.key;S.armClr=false;clearTimeout(S.armT);S.armT=setTimeout(()=>{S.armDel='';if(S.view==='dash')dash();},5000);dash();return;}
    S.armDel='';clearTimeout(S.armT);
    const ids=[p.pre&&p.pre.id,p.post&&p.post.id].filter(Boolean);
    const h=LS.get('hidden',[]);LS.set('hidden',h.concat(ids));
    const loc=LS.get('local',{});
    ids.forEach(id=>{post({action:'save',record:{id,type:'deleted',name:p.name,date:new Date().toISOString()}});delete loc[id];});
    LS.set('local',loc);S.records=S.records.filter(r=>!ids.includes(r.id));dash();
  });
  $('clr').onclick=()=>{
    if(!S.armClr){S.armClr=true;S.armDel='';clearTimeout(S.armT);S.armT=setTimeout(()=>{S.armClr=false;if(S.view==='dash')dash();},5000);dash();return;}
    S.armClr=false;clearTimeout(S.armT);
    const now=new Date().toISOString();LS.set('resetAt',now);
    if(remote()){post({action:'save',record:{id:'reset_marker',type:'reset',name:'reset',date:now}});post({action:'clear',code:S.code});}
    LS.set('local',{});S.records=[];S.att=[];dash();
  };
}

  try{const A=remote()?await pullAll(S.code):localAll();S.att=attendees(A);S.records=visible(A);if(S.view==='dash')dash();}catch(e){}
}

function route(){
  if(location.hash==='#attend'){S.view='attend';render();return;}
  if(S.view==='attend'){S.view='home';}
  if(location.hash==='#teacher'){if(S.view!=='dash'&&S.view!=='cert'){S.err='';S.view='login';}}

  render();
}
